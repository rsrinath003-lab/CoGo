<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CoGo – Your way, together</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0B0F14;--card:#151B24;--ink:#F2F5F7;--mute:#8A97A5;--line:#232B36;--teal:#10B981;--tealT:#0E2A24;--navy:#151B24;--logoN:#F2F5F7;--logoG:#34D399;--onNavy:#fff;--shadow:none;--frame:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark) and (max-width:0px){:root:not([data-theme="light"]){--logoN:#EAF2F4;--logoG:#2DD4BC;--bg:#0A151F;--card:#132636;--ink:#EAF2F4;--mute:#8FA3B0;--line:#243D50;--teal:#2DD4BC;--tealT:#12413F;--navy:#1B3A52;--shadow:none;--frame:#040A0F}}
:root[data-theme="dark"]{--logoN:#EAF2F4;--logoG:#2DD4BC;--bg:#0A151F;--card:#132636;--ink:#EAF2F4;--mute:#8FA3B0;--line:#243D50;--teal:#2DD4BC;--tealT:#12413F;--navy:#1B3A52;--shadow:none;--frame:#040A0F}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 Figtree,system-ui,sans-serif;display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:420px;height:100vh;max-height:860px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:560px){.app{border:10px solid var(--frame);border-radius:40px;height:820px}}
main{flex:1;overflow-y:auto;padding:16px 18px 20px}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;margin:0;letter-spacing:-.4px}
h2{font-size:24px;line-height:1.15;margin-bottom:6px}h3{font-size:16px;margin-bottom:8px}
.sub{color:var(--mute);margin:0 0 16px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.back{border:0;background:var(--card);box-shadow:var(--shadow);width:38px;height:38px;border-radius:12px;font-size:20px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:15px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cta{width:100%;border:0;border-radius:16px;padding:17px;font-weight:600;font-size:16px;background:#047857;color:#fff;margin-top:6px}
:root[data-theme="dark"] .cta,.dk .cta{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cta{color:#fff}}
.cta.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--navy);color:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:12px}
.opt b{font:700 19px Sora,sans-serif;display:block}.opt small{opacity:.75}
.opt.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.opt svg{width:30px;height:30px;flex:none}
.pill{display:inline-block;background:var(--tealT);color:var(--teal);border-radius:99px;padding:3px 10px;font-weight:600;font-size:12.5px}
.pill.g{background:var(--line);color:var(--mute)}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pil{background:var(--tealT);border-radius:14px;padding:10px 8px;text-align:center}
.pil small{display:block;font:700 10.5px Sora,sans-serif;letter-spacing:.8px;color:var(--teal)}
.pil b{font:700 16px Sora,sans-serif}
.pil span{display:block;font-size:11.5px;color:var(--mute)}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px;color:var(--mute)}
select,input[type=date],input[type=text]{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.big{font:700 26px Sora,sans-serif}
.av{width:36px;height:36px;border-radius:50%;background:var(--tealT);color:var(--teal);display:grid;place-items:center;font-weight:700;flex:none}
.mem{display:flex;gap:12px;align-items:center;padding:8px 0}.mem+.mem{border-top:1px solid var(--line)}
.m{max-width:82%;padding:9px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.m small{display:block;font-weight:600;font-size:11.5px;color:var(--mute)}
.m.me{margin-left:auto;background:#047857;color:#fff;border-color:#047857}.m.me small{color:#fff;opacity:.85}
.send{display:flex;gap:8px}.send button{border:0;background:var(--navy);color:#fff;border-radius:12px;padding:0 16px;font-weight:600}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 13px;margin:0 6px 8px 0;font-size:13.5px}
.chip.on{background:var(--tealT);border-color:var(--teal);color:var(--teal);font-weight:600}
.veh{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:10px}
.veh.on{border-color:var(--teal);background:var(--tealT)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px 10px}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);padding:6px 0;font-weight:600}
nav button.on{color:var(--teal)}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{background:var(--navy);color:#fff;border-radius:24px;padding:22px;margin-bottom:14px}
.hero h1{font-size:34px}.hero p{margin:6px 0 0;opacity:.8}
.tog{width:46px;height:27px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--teal)}.tog.on:after{left:22px}
.toast{position:absolute;left:18px;right:18px;bottom:84px;background:var(--navy);color:#fff;padding:12px 14px;border-radius:12px;font-weight:600;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.note{font-size:12px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.toast,.tog:after{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* ---- CONFIG: all places, flights, pools, fares and impact assumptions are editable ---- */
var CFG={airport:"Bhogapuram Airport (VGA)",places:{"IIM Visakhapatnam":52,"Madhurawada":48,"Rushikonda":50,"Visakhapatnam city":55},
co2PerKm:0.17,soloFare:800,
veh:[["Hatchback",800,3],["Sedan",1000,4],["SUV",1400,6]],
flights:{from:[["IndiGo","6E 512","Hyderabad","09:40"],["Air India","AI 561","Delhi","13:15"],["IndiGo","6E 2204","Bengaluru","17:30"],["IndiGo","6E 6118","Mumbai","21:05"]],
to:[["IndiGo","6E 513","Hyderabad","07:30"],["Air India","AI 562","Delhi","11:50"],["IndiGo","6E 2205","Bengaluru","15:20"],["IndiGo","6E 6119","Mumbai","19:45"]]}};
var P=[{id:1,fl:"6E 512",dir:"from",dest:"IIM Visakhapatnam",pick:"Arrivals gate, taxi bay",n:["Aarav","Meera"],veh:1,bags:"2 cabin, 1 check-in"},
{id:2,fl:"AI 561",dir:"from",dest:"IIM Visakhapatnam",pick:"Arrivals gate, taxi bay",n:["Kabir","Isha","Rohan"],veh:1,bags:"3 check-in"},
{id:3,fl:"6E 6118",dir:"from",dest:"Rushikonda",pick:"Arrivals gate, taxi bay",n:["Sana"],veh:0,bags:"1 check-in"},
{id:4,fl:"6E 513",dir:"to",dest:"IIM Visakhapatnam",pick:"Campus main gate",n:["Dev","Tara"],veh:1,bags:"2 check-in"},
{id:5,fl:"6E 2205",dir:"to",dest:"IIM Visakhapatnam",pick:"Campus main gate",n:["Nikhil","Ananya"],veh:1,bags:"1 cabin, 1 check-in"}];
P.forEach(function(p){p.st={};p.msgs=[[p.n[0],"Hi all, travelling with "+p.bags+"."]];p.n.forEach(function(x,i){p.st[x]=(i+p.id)%4})});
var ST=["Flight landed","Waiting for baggage","Baggage collected","At pickup point","Ready to leave"];
var S={scr:"onb",tab:"home",dir:"from",date:new Date().toISOString().slice(0,10),dest:"IIM Visakhapatnam",fl:null,pool:null,ptab:"info",veh:1,time:"+20 min",me:"Guest",
trips:[{t:"VGA → IIM Visakhapatnam",d:"Sample · 4 Sep",r:3,km:52,sv:533,done:1},{t:"IIM Visakhapatnam → VGA",d:"Sample · 21 Sep",r:2,km:52,sv:400,done:1},{t:"VGA → IIM Visakhapatnam",d:"Sample · 9 Oct",r:4,km:50,sv:550,done:1}],
prefs:{women:false,quiet:true,wait:true},safe:{verify:true,share:true,notif:true}};
var app=document.getElementById("app");
var IC={home:"M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",trips:"M4 6h16M4 12h16M4 18h10",disc:"M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16zM21 21l-4.3-4.3",impact:"M5 19c0-9 5-14 15-14 0 10-5 15-14 15zM5 19l8-8",prof:"M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"};
function svg(k){return '<svg viewBox="0 0 24 24"><path d="'+IC[k]+'"/></svg>'}
var PL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16l9-3 4-9 2 1-2 8 6 2-1 2-6-1-3 4-2-1 1-4-8 1z"/></svg>';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function LOGO(k){return '<div style="display:flex;flex-direction:column;align-items:center;gap:'+(12*k)+'px;padding:'+(18*k)+'px 0 '+(14*k)+'px"><svg viewBox="0 0 200 130" role="img" aria-label="CoGo logo mark" style="width:'+(180*k)+'px"><path d="M12 30H52C84 30 86 66 118 66" fill="none" style="stroke:var(--logoN)" stroke-width="15" stroke-linecap="round"/><path d="M12 112H52C84 112 86 66 118 66H176M156 44L178 66L156 88" fill="none" stroke="#00907A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 52C100 28 124 14 148 14C150 38 132 58 104 52Z" fill="#66B239"/><path d="M110 46C122 34 132 28 142 21" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg><div style="font:700 '+(78*k)+'px/1 Sora,sans-serif;letter-spacing:-3px"><span style="color:var(--logoN)">Co</span><span style="color:var(--logoG)">Go</span></div><div style="font:italic 600 '+(22*k)+'px Figtree,sans-serif">Your way, together.</div><div style="background:#007A68;color:#fff;border-radius:99px;padding:8px 20px;font:700 '+Math.max(11,13*k)+'px Figtree,sans-serif;letter-spacing:2px">SAVE. CONNECT. SUSTAIN.</div></div>'}
function MARK(){return '<div style="width:92px;height:92px;border-radius:26px;background:#059669;display:grid;place-items:center;margin:0 auto"><svg viewBox="0 0 200 130" style="width:64px" aria-hidden="true"><path d="M12 30H52C84 30 86 66 118 66" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/><path d="M12 112H52C84 112 86 66 118 66H176M156 44L178 66L156 88" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><path d="M104 52C100 28 124 14 148 14C150 38 132 58 104 52Z" fill="#BBF7D0"/></svg></div>'}
function go(s,t){S.scr=s;if(t)S.tab=t;render()}
function toast(t){var e=document.getElementById("toast");if(!e)return;e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},1700)}
function tot(){var a={sv:0,r:0,tr:0,km:0,co:0,n:0};S.trips.forEach(function(t){if(!t.done)return;a.n++;a.sv+=t.sv;a.r+=t.r;a.tr+=t.r-1;a.km+=(t.r-1)*t.km;a.co+=(t.r-1)*t.km*CFG.co2PerKm});return a}
function pil(sv,cn,su){return '<div class="pillars"><div class="pil"><small>SAVE</small><b>'+sv+'</b><span>saved</span></div><div class="pil"><small>CONNECT</small><b>'+cn+'</b><span>travelling together</span></div><div class="pil"><small>SUSTAIN</small><b>'+su+'</b><span>CO₂ avoided (est.)</span></div></div>'}
function back(to){return '<div class="top"><button class="back" aria-label="Back" onclick="go(\''+to+'\')">‹</button></div>'}
function mine(p){return p.n.indexOf("You")>-1}
function fare(p,n){return Math.round(CFG.veh[p.veh][1]/Math.max(n,2))}
function render(){
var h="",nav=["home","trips","disc","impact","prof"].indexOf(S.scr)>-1,a=tot();
if(S.scr=="onb")h='<main style="display:flex;flex-direction:column;justify-content:center">'+MARK()+'<h1 style="font-size:40px;text-align:center;margin-top:16px">CoGo</h1><p style="text-align:center;color:var(--mute);margin:6px 0 10px;font-size:17px">Your way, together.</p><p style="text-align:center;color:var(--teal);font:600 12px Figtree,sans-serif;letter-spacing:4px;margin:0 0 20px">SAVE. CONNECT. SUSTAIN.</p><p style="text-align:center;color:var(--mute);margin:0 0 26px;font-size:16px">Find people going your way.<br>Share the journey. Split the cost.</p><div class="card row" style="gap:14px;justify-content:flex-start"><span class="av" style="width:52px;height:52px;font-size:22px">+</span><span><b>Add a photo (optional)</b><br><span class="note">Shown to co-travellers in your pools</span></span></div><label>Your name</label><input type="text" id="nm" placeholder="e.g. Priya"><button class="cta" onclick="S.me=document.getElementById(\'nm\').value.trim()||\'Guest\';go(\'home\',\'home\')">Continue</button><p class="note" style="text-align:center;margin-top:10px">Free during the pilot · No account needed<br>Prototype with sample data</p></main>';
if(S.scr=="home")h='<main><p class="sub" style="margin:0">Hi '+esc(S.me)+'</p><div style="margin:6px 0 16px"><div style="font:700 34px Sora,sans-serif;letter-spacing:-1px">Co<span style="color:var(--teal)">Go</span></div><div class="note" style="font-size:14px">Your way, together.</div></div><p class="sub">Find people going your way. Share the journey. Split the cost.</p><button class="opt" onclick="S.dir=\'to\';go(\'search\')">'+PL+'<span><b>To airport</b><small>Share a ride to the terminal</small></span></button><button class="opt alt" onclick="S.dir=\'from\';go(\'search\')">'+PL+'<span><b>From airport</b><small>Find flightmates after landing</small></span></button><h3 style="margin-top:18px">Your impact</h3>'+pil("₹"+a.sv,a.r,a.co.toFixed(0)+" kg")+'<p class="note">Based on sample journeys. Estimates only.</p></main>';
if(S.scr=="search"){var to=S.dir=="to";h='<main>'+back('home')+'<h2>Where to?</h2><p class="sub">Three taps, no typing.</p><div class="seg"><button class="'+(to?'on':'')+'" onclick="S.dir=\'to\';render()">To airport</button><button class="'+(to?'':'on')+'" onclick="S.dir=\'from\';render()">From airport</button></div><label>Airport</label><select><option>'+CFG.airport+'</option></select><label>'+(to?'Pickup location':'Destination')+'</label><select id="ds">'+Object.keys(CFG.places).map(function(k){return '<option'+(k==S.dest?' selected':'')+'>'+k+'</option>'}).join('')+'</select><label>Travel date</label><input type="date" id="dt" value="'+S.date+'"><button class="cta" onclick="S.dest=document.getElementById(\'ds\').value;S.date=document.getElementById(\'dt\').value;go(\'flights\')">Find flights</button>'+pil("Save","Connect","Sustain").replace(/<b>[^<]*<\/b><span>[^<]*<\/span>/g,'')+'</main>'}
if(S.scr=="flights"){var l=CFG.flights[S.dir];h='<main>'+back('search')+'<h2>Choose your flight</h2><p class="sub">'+(S.dir=="from"?"Arrivals":"Departures")+' · '+S.date+' · sample schedule</p>'+l.map(function(f,i){var ps=P.filter(function(p){return p.fl==f[1]}),c=ps.reduce(function(s,p){return s+p.n.length},0),est=Math.round(1000/Math.max(2,Math.min(4,c+1)));return '<button class="veh" style="display:block" onclick="S.fl=CFG.flights[S.dir]['+i+'];go(\'pools\')"><div class="row"><div><b>'+f[0]+' · '+f[1]+'</b><div class="note">'+(S.dir=="from"?f[2]+' → VGA':'VGA → '+f[2])+'</div></div><div class="big">'+f[3]+'</div></div><div class="row" style="margin-top:8px"><span class="pill '+(c?'':'g')+'">'+(c?c+' looking to share · '+ps.length+' pool'+(ps.length>1?'s':''):'No pools yet')+'</span><b>~₹'+est+' / person</b></div></button>'}).join('')+'</main>'}
if(S.scr=="pools"){var ps=P.filter(function(p){return p.fl==S.fl[1]});h='<main>'+back('flights')+'<h2>'+S.fl[1]+' pools</h2><p class="sub">'+S.fl[3]+' · matched by flight, date, direction and destination</p>'+(ps.length?ps.map(poolCard).join(''):'<div class="card" style="text-align:center"><div class="big">✈︎</div><b>No pools yet</b><p class="sub">Be first. Others on this flight will see your pool.</p></div>')+'<button class="cta" onclick="mk()">Create a new pool</button></main>'}
if(S.scr=="pool")h=poolView();
if(S.scr=="done"){var p=S.pool,n=p.n.length,v=CFG.veh[p.veh],sv=CFG.soloFare-Math.round(v[1]/n),km=CFG.places[p.dest]||50;h='<main><div class="hero" style="text-align:center"><div class="big" style="font-size:30px">Your way, together.</div><p>Ride confirmed · '+S.time+'</p></div><div class="card"><div class="row"><b>'+p.fl+' · '+(p.dir=="from"?"VGA → "+p.dest:p.dest+" → VGA")+'</b></div><p class="note" style="margin:6px 0">Pickup: '+p.pick+'<br>Vehicle: '+v[0]+' ('+v[2]+' seats)<br>Group: '+p.n.join(", ")+'</p><div class="row"><span>Fare split (est.)</span><b class="big">₹'+Math.round(v[1]/n)+'</b></div></div>'+pil("₹"+Math.max(sv,0),n,((n-1)*km*CFG.co2PerKm).toFixed(1)+" kg")+'<div class="card note">Estimates: ₹'+CFG.soloFare+' assumed solo fare; '+(n-1)+' vehicle trip(s) avoided over about '+km+' km each; '+CFG.co2PerKm+' kg CO₂ per car-km. Sample figures, not measured.</div><button class="cta" onclick="go(\'trips\',\'trips\')">View my journeys</button></main>'}
if(S.scr=="trips")h='<main><h2>My journeys</h2><p class="sub">Planned and past shared rides</p>'+S.trips.slice().reverse().map(function(t){return '<div class="card"><div class="row"><b>'+t.t+'</b><span class="pill '+(t.done?'g':'')+'">'+(t.done?'Completed':'Planned')+'</span></div><div class="note">'+t.d+' · '+t.r+' riders</div><div class="row" style="margin-top:8px"><span class="pill">Saved ₹'+t.sv+'</span><span class="note">'+((t.r-1)*t.km*CFG.co2PerKm).toFixed(1)+' kg CO₂ avoided (est.)</span></div></div>'}).join('')+'</main>';
if(S.scr=="disc"){var f=S.dir;h='<main><h2>Discover pools</h2><p class="sub">Open pools, sample data</p><div class="seg"><button class="'+(f=="from"?'on':'')+'" onclick="S.dir=\'from\';render()">From airport</button><button class="'+(f=="to"?'on':'')+'" onclick="S.dir=\'to\';render()">To airport</button></div>'+P.filter(function(p){return p.dir==f}).map(poolCard).join('')+'</main>'}
if(S.scr=="impact"){var sc=Math.min(100,Math.round(a.co*1.2+a.r*3)),m=[["Jul",0],["Aug",267],["Sep",533],["Oct",550],["Nov",a.sv>1483?a.sv-1483:0]],mx=Math.max.apply(null,m.map(function(x){return x[1]}))||1;
h='<main><h2>CoGo Impact</h2><p class="sub">SAVE. CONNECT. SUSTAIN.</p>'+pil("₹"+a.sv,a.r,a.co.toFixed(0)+" kg")+'<div class="card"><div class="row"><b>Impact score</b><span class="big">'+sc+'</span></div><div class="bar"><i style="width:'+sc+'%"></i></div></div><div class="card"><h3>Savings by month (sample)</h3><svg viewBox="0 0 300 120" width="100%" role="img" aria-label="Monthly savings bar chart">'+m.map(function(x,i){var hh=Math.round(x[1]/mx*80);return '<rect x="'+(i*58+14)+'" y="'+(95-hh)+'" width="34" height="'+hh+'" rx="6" fill="var(--teal)"/><text x="'+(i*58+31)+'" y="113" text-anchor="middle" font-size="11" fill="var(--mute)">'+x[0]+'</text>'}).join('')+'</svg></div><div class="card"><div class="row"><span>Shared rides</span><b>'+a.n+'</b></div><div class="row"><span>Passengers connected</span><b>'+a.r+'</b></div><div class="row"><span>Vehicle trips avoided</span><b>'+a.tr+'</b></div><div class="row"><span>Kilometres avoided</span><b>'+a.km+' km</b></div><div class="row"><span>CO₂ avoided (est.)</span><b>'+a.co.toFixed(1)+' kg</b></div></div><div class="card note"><b>Assumptions.</b> Each extra rider avoids one vehicle trip of the route distance. Emissions use '+CFG.co2PerKm+' kg CO₂ per car-km and ignore the shared vehicle’s own occupancy effects. Savings assume a ₹'+CFG.soloFare+' solo fare. Estimates from sample data, not measurements.</div></main>'}
if(S.scr=="prof"){var sc2=Math.min(100,Math.round(a.co*1.2+a.r*3));h='<main><div class="row" style="justify-content:flex-start;gap:14px;margin-bottom:14px"><div class="av" style="width:60px;height:60px;font-size:24px">'+esc(S.me[0])+'</div><div><h2 style="margin:0">'+esc(S.me)+'</h2><span class="pill">Impact score '+sc2+'</span></div></div>'+pil("₹"+a.sv,a.r,a.co.toFixed(0)+" kg")+'<div class="card"><h3>Travel preferences</h3>'+tg("prefs","women","Women-only pools")+tg("prefs","quiet","Quiet ride")+tg("prefs","wait","Max wait 20 min")+'</div><div class="card"><h3>Safety and notifications</h3>'+tg("safe","verify","Show verified badge")+tg("safe","share","Share ride details with a contact")+tg("safe","notif","Pool notifications")+'</div><div class="card"><h3>Saved destinations</h3><span class="chip on">IIM Visakhapatnam</span><span class="chip">Rushikonda</span><span class="chip">Madhurawada</span></div><button class="cta ghost" onclick="go(\'trips\',\'trips\')">Journey history</button></main>'}
app.innerHTML=h+'<div class="toast" id="toast" role="status"></div>'+(nav?'<nav>'+[["home","Home"],["trips","Journeys"],["disc","Discover"],["impact","Impact"],["prof","Profile"]].map(function(t){return '<button class="'+(S.scr==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+svg(t[0])+t[1]+'</button>'}).join('')+'</nav>':'');
var c=document.getElementById("msgs");if(c)c.scrollTop=c.scrollHeight}
function tg(g,k,l){return '<div class="row" style="padding:7px 0"><span>'+l+'</span><button class="tog '+(S[g][k]?'on':'')+'" aria-label="'+l+'" onclick="S.'+g+'.'+k+'=!S.'+g+'.'+k+';render()"></button></div>'}
function poolCard(p){var n=p.n.length,v=CFG.veh[p.veh],full=n>=v[2];return '<div class="card"><div class="row"><b>'+p.fl+' → '+p.dest+'</b><span class="pill">'+(p.dest==S.dest?'Exact match':'Nearby')+'</span></div><div class="note">'+v[0]+' · '+n+'/'+v[2]+' seats · '+p.pick+'</div><div class="row" style="margin-top:10px"><span><b>~₹'+fare(p,n+1)+'</b> / person</span><span class="pill g">'+(p.st&&Object.keys(p.st).filter(function(k){return p.st[k]==4}).length)+' of '+n+' ready</span></div><button class="cta" style="padding:11px" onclick="S.pool=P['+P.indexOf(p)+'];S.ptab=\'info\';S.veh=S.pool.veh;go(\'pool\')">'+(mine(p)?'Open pool':full?'View pool':'View and join')+'</button></div>'}
function mk(){var p={id:P.length+1,fl:S.fl[1],dir:S.dir,dest:S.dest,pick:S.dir=="from"?"Arrivals gate, taxi bay":"Campus main gate",n:["You"],veh:1,bags:"Add yours in chat",st:{You:0},msgs:[["CoGo","Pool created. Share your bags and pickup spot here."]]};P.push(p);S.pool=p;S.ptab="info";S.veh=1;go("pool")}
function poolView(){var p=S.pool,n=p.n.length,v=CFG.veh[p.veh],j=mine(p),km=CFG.places[p.dest]||50,sv=CFG.soloFare-fare(p,n),T=[["info","Overview"],["chat","Chat"],["ready","Ready"],["ride","Ride"]];
var b="";
if(S.ptab=="info")b=pil("₹"+Math.max(sv,0),n,((n-1)*km*CFG.co2PerKm).toFixed(1)+" kg")+'<div class="card"><div class="row"><b>'+p.fl+'</b><span class="pill">'+(p.dir=="from"?"Arriving":"Departing")+'</span></div><p class="note" style="margin:6px 0 0">'+(p.dir=="from"?"VGA → "+p.dest:p.dest+" → VGA")+'<br>Pickup: '+p.pick+'<br>Vehicle: '+v[0]+' · Baggage: '+p.bags+'<br>Status: '+(n<2?"Waiting for more riders":"Gathering")+'</p></div><div class="card"><h3>Passengers ('+n+')</h3>'+p.n.map(function(x){return '<div class="mem"><div class="av">'+x[0]+'</div><b>'+x+'</b></div>'}).join('')+'</div>'+(j?'<button class="cta ghost" onclick="leave()">Leave pool</button>':'<button class="cta" onclick="join()">Join pool</button>');
if(S.ptab=="chat")b='<div id="msgs" style="max-height:330px;overflow:auto;margin-bottom:8px">'+p.msgs.map(function(x){return '<div class="m '+(x[0]=="You"?'me':'')+'"><small>'+x[0]+'</small>'+esc(x[1])+'</div>'}).join('')+'</div>'+(j?'<div class="send"><input type="text" id="tx" placeholder="Message the pool" onkeydown="if(event.key===\'Enter\')sendM()"><button onclick="sendM()">Send</button></div>':'<p class="note">Join the pool to chat.</p>');
if(S.ptab=="ready")b=(j?'<div class="card"><h3>Your status</h3>'+ST.map(function(s,i){return '<button class="chip '+(p.st.You==i?'on':'')+'" onclick="S.pool.st.You='+i+';S.pool.msgs.push([\'You\',\'Status: '+s+'\']);render();toast(\'Status shared\')">'+s+'</button>'}).join('')+'</div>':'')+'<div class="card"><h3>The group</h3>'+p.n.map(function(x){var s=p.st[x]==null?0:p.st[x];return '<div class="mem"><div class="av">'+x[0]+'</div><div class="row" style="flex:1"><b>'+x+'</b><span class="pill '+(s==4?'':'g')+'">'+ST[s]+'</span></div></div>'}).join('')+'</div>';
if(S.ptab=="ride"){var nn=Math.max(n,2);b='<p class="sub">Vehicle options fit your group size.</p>'+CFG.veh.map(function(x,i){var ok=nn<=x[2];return '<button class="veh '+(S.veh==i?'on':'')+'" onclick="S.veh='+i+';render()"'+(ok?'':' style="opacity:.5"')+'><span><b>'+x[0]+'</b><div class="note">₹'+x[1]+' total · '+x[2]+' seats'+(ok?'':' · too small')+'</div></span><span class="big">₹'+Math.round(x[1]/nn)+'</span></button>'}).join('')+'<label>Proposed departure</label><select onchange="S.time=this.value">'+["+10 min","+20 min","+30 min"].map(function(t){return '<option'+(t==S.time?' selected':'')+'>'+t+'</option>'}).join('')+'</select><p class="note">'+Math.max(1,n-1)+' of '+n+' riders confirmed (sample). Fares are estimates.</p>'+(j?'<button class="cta" onclick="S.pool.veh=S.veh;S.trips.push({t:\''+(p.dir=="from"?"VGA → "+p.dest:p.dest+" → VGA")+'\',d:\'Planned · '+S.date+'\',r:'+n+',km:'+km+',sv:'+Math.max(sv,0)+',done:0});go(\'done\')">Confirm ride</button>':'<p class="note">Join the pool to confirm.</p>')}
return '<main>'+back('pools')+'<h2>'+p.fl+' pool</h2><div class="seg">'+T.map(function(t){return '<button class="'+(S.ptab==t[0]?'on':'')+'" onclick="S.ptab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join('')+'</div>'+b+'</main>'}
function join(){var p=S.pool;if(p.n.length>=CFG.veh[p.veh][2]){toast("Pool is full");return}p.n.push("You");p.st.You=0;p.msgs.push(["CoGo","You joined. Say hi and share your bags."]);render();toast("You joined the pool")}
function leave(){var p=S.pool;p.n=p.n.filter(function(x){return x!="You"});delete p.st.You;render();toast("You left the pool")}
function sendM(){var e=document.getElementById("tx"),p=S.pool;if(!e||!e.value.trim())return;p.msgs.push(["You",e.value.trim()]);var o=p.n.filter(function(x){return x!="You"});render();if(o.length)setTimeout(function(){p.msgs.push([o[0],"Sounds good, see you at "+p.pick.toLowerCase()+"."]);if(S.scr=="pool"&&S.ptab=="chat")render()},1200)}
render();
</script>
</body>
</html>
